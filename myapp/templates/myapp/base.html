<!DOCTYPE html>
{% load static %}

<html>
<head>
    <link rel="stylesheet" type="text/css" href="{% static '/myapp/style.css' %}" />
    <title>Online Store APP - {% block title %}Welcome!{% endblock %}</title>
</head>
<body>
    <div>
        {% block body_block %}{% endblock %}
    </div>
    <hr />
    <div>
        <ul>
            <li class="hbar1"><a href="{% url 'myapp:about' %}">About</a></li>
            <li class="hbar1"><a href="{% url 'myapp:index' %}">Home</a></li>
            <li class="hbar1"><a href="{% url 'myapp:products' %}">Products</a></li>
            {% if user.is_authenticated %}
                <li class="hbar1"><a href="{% url 'myapp:myorders' %}">My Orders</a></li>
                <li class="hbar1"><a href="{% url 'myapp:logout' %}">Logout</a></li>
            {% else %}
                <li class="hbar1"><a href="{% url 'myapp:login' %}">Login</a></li>
            {% endif %}
        </ul>
    </div>
</body>
</html>
