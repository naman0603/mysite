<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Online Store APP</title>
</head>
<body>
    {% if cat_list %}
        <h2>List of Categories</h2>
        <ol>
{#            {% for cat in cat_list %}#}
{#                <li>{{ cat.name }}</li>#}
{#            {% endfor %}#}
                {% for cat in cat_list %}
                <li><a href="{% url 'myapp:detail' cat.id %}">{{ cat.name }}</a></li>
                {% endfor %}

        </ol>
    {% else %}
        <strong>No available categories!</strong>
    {% endif %}

    <p><a href="/myapp/about">About page</a></p>

</body>
</html>
