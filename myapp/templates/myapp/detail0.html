<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Category Detail</title>
</head>
<body>
    <h2>Category: {{ category.name }}</h2>
    <p>Warehouse: {{ category.warehouse }}</p>

    <h3>Products:</h3>
    <ul>
        {% for product in category.products.all %}
            <li>{{ product.name }}</li>
        {% endfor %}
    </ul>

    <p><a href="{% url 'myapp:index' %}">Back to Home</a></p>
</body>
</html>
